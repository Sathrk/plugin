name: Build Minecraft Plugin

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'oracle' # Oracle generally supports newer Java versions faster
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    - name: Upload JAR File
      uses: actions/upload-artifact@v4
      with:
        name: CustomWebMap-Plugin
        path: target/CustomWebMap-1.0.jar
